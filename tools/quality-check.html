<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Santa compositing check</title>
<style>
  body { background:#11131a; color:#dfe6f2; font:14px/1.5 system-ui, sans-serif; margin:16px; }
  h1 { font-size:17px; margin:0 0 10px; }
  h2 { font-size:14px; color:#ffd24c; margin:18px 0 6px; }
  .note { color:#8e9ab3; max-width:820px; }
  canvas { width:820px; border:1px solid #2a3346; display:block; margin-bottom:6px; }
  canvas.half { width:406px; display:inline-block; margin-right:6px; vertical-align:top; }
  canvas.sheet { width:820px; }
  #readout { color:#ffd24c; font-weight:600; margin-top:10px; }
</style>
</head>
<body>
<h1>Compositing check — real photograph, real measurement</h1>
<div id="out"></div>
<div id="readout">…</div>

<!-- Loaded BEFORE the harness script: it calls PhotorealSanta.load() and
     Scene.renderFrame, so the modules must already be defined. -->
<script src="../santa.js"></script>
<script src="../santa-photo.js"></script>
<script src="../engine.js"></script>

<script>
const PHOTO = "test-room.jpg";
const DOOR_PX = 1054, DOOR_CM = 200, MAXW = 1600;

function label(t){ const h=document.createElement("h2"); h.textContent=t;
  document.getElementById("out").appendChild(h); }
function newCanvas(w,h,cls){ const c=document.createElement("canvas"); c.width=w;c.height=h;
  if(cls)c.className=cls; document.getElementById("out").appendChild(c); return c; }
function crop(src,cx,cy,cw,ch,z){ z=z||2; const c=newCanvas(cw*z,ch*z);
  c.getContext("2d").drawImage(src,cx,cy,cw,ch,0,0,cw*z,ch*z); return c; }

(async function () {
  const img = new Image(); img.src = PHOTO; await img.decode();
  const s = Math.min(1, MAXW / img.width);
  const W = Math.round(img.width*s), H = Math.round(img.height*s);
  const doorPx = DOOR_PX * s;
  const photoReport = await PhotorealSanta.load();
  const Character = PhotorealSanta.ready ? PhotorealSanta : Santa;
  const ready = PhotorealSanta.ready;

  // ---- 1. what do the sprites actually contain? ------------------------
  // Laid over a checkerboard so residual green screen, bad scale or clipping
  // is obvious. The seated photo has a transparent chair and is not a squat.
  label("Sprites on a checkerboard — full bodies, one physical body scale");
  const poses = ["sit","drink","eat","cheer","wave","stand"];
  const cw = 200, chh = 300;
  const sheet = newCanvas(cw*poses.length, chh, "sheet");
  const sg = sheet.getContext("2d");
  for (let x=0; x<sheet.width; x+=16) for (let y=0; y<sheet.height; y+=16) {
    sg.fillStyle = ((x/16+y/16)%2) ? "#2b3242" : "#3a4356";
    sg.fillRect(x,y,16,16);
  }
  poses.forEach(function (pose, i) {
    const g = document.createElement("canvas");
    g.width = cw; g.height = chh;
    const poseScale = Character.poseScale && Character.poseScale[pose] || 1;
    const feet = Character.feetOffset && Character.feetOffset[pose] || 0;
    // 220px is the common measured body span. Raised hands may extend above
    // it, so leave enough headroom to show cheer without clipping.
    const scale = 220 / Character.height * poseScale;
    Character.toCanvas(g.getContext("2d"), Character.build(pose),
                       { x: cw/2, y: chh-10-feet*scale, scale:scale, flip:false });
    Scene.despillCanvas(g);
    sg.drawImage(g, i*cw, 0);
    sg.fillStyle="#ffd24c"; sg.font="12px system-ui"; sg.fillText(pose, i*cw+6, 14);
  });

  // ---- 2. occlusion -----------------------------------------------------
  const stick = { x1:W*0.055, y1:H*0.71, x2:W*0.055, y2:H*0.71-doorPx };
  const place = { x:W*0.34, y:H*0.78 };
  function drawPose(pose, occlusion) {
    const cv = document.createElement("canvas"); cv.width=W; cv.height=H;
    Scene.renderFrame(cv.getContext("2d"), Character, {
      w:W,h:H,photo:img, place:place,stick:stick,refCm:DOOR_CM,refKey:"door",
      pose:pose,matchLight:true,light:{x:-0.55,y:0.35},
      tint:{r:1,g:1,b:1}, occlusion:occlusion||null,
    },0);
    return cv;
  }
  const occ = Scene.newOcclusionMask(W,H);
  const og = occ.getContext("2d");
  og.fillStyle="#fff";
  og.fillRect(Math.round(W*0.33),Math.round(H*0.55),Math.round(W*0.33),Math.round(H*0.45));
  og.filter="blur(6px)"; og.drawImage(occ,0,0); og.filter="none";

  label("Occlusion — LEFT: pasted over the table. RIGHT: table in front of him");
  const cx=Math.round(W*0.14), cy=Math.round(H*0.40), cw2=Math.round(W*0.56), ch2=Math.round(H*0.60);
  crop(drawPose("stand"),cx,cy,cw2,ch2,0.85).className="half";
  crop(drawPose("stand",occ),cx,cy,cw2,ch2,0.85).className="half";

  const r = Scene.solveStatic(place,stick,DOOR_CM,W,H,"stand","door",false,
                              Scene.isSeated(Character, "sit"));
  document.getElementById("readout").textContent =
    "photoreal art: " + ready + " · canvas " + W+"x"+H +
    " · door " + doorPx.toFixed(0) + "px = " + DOOR_CM + "cm" +
    " · Santa " + Math.round(r.size/(r.pxPerCm*r.perspective)) + "cm = " +
    (r.size/H*100).toFixed(0) + "% of frame height" +
    " · measured body pixels " + poses.map(function (p) {
      return p + ":" + (photoReport.bodyPixels[p] || "n/a");
    }).join(", ");
  window.__ready = true;
})();
</script>
</body>
</html>
