<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Santa — device export test</title>
<style>
  body { font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:#12172a; color:#e9edf7; margin:0; padding:18px 16px 60px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:#98a2c0; font-size:.85rem; margin:0 0 18px; }
  button { font:inherit; font-weight:600; padding:16px; width:100%; border-radius:12px;
           border:0; margin-bottom:12px; background:linear-gradient(135deg,#ffd24c,#ff8b3d); color:#1a1400; }
  button.ghost { background:#1e2740; color:#e9edf7; }
  .verdict { padding:18px; border-radius:14px; font-weight:700; font-size:1.1rem;
             margin:14px 0; text-align:center; }
  .pass { background:#134d36; color:#7ff0bd; }
  .fail { background:#5c1a1a; color:#ff9d9d; }
  .warn { background:#5c4a12; color:#ffd980; }
  .busy { background:#1e2740; color:#98a2c0; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; margin-top:10px; }
  td { padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.08); vertical-align:top; }
  td:last-child { text-align:right; white-space:nowrap; }
  .ok { color:#7ff0bd; } .no { color:#ff9d9d; } .mid { color:#ffd980; }
  .note { color:#98a2c0; font-size:.8rem; margin-top:20px; }
  .preview { width:100%; border-radius:10px; margin-top:12px; background:#000; }
  a.save { display:block; padding:12px; margin:8px 0; border-radius:10px;
           background:#1e2740; color:#ffd24c; text-align:center; }
</style>
</head>
<body>
<h1>🎅 Device export test</h1>
<p class="sub">Builds the same full-frame, postcard and 9:16 PNG files the app saves.</p>

<button id="go">▶ Run the test on this device</button>
<div class="verdict busy" id="v">Not run yet</div>

<table id="t"></table>
<div id="downloads"></div>
<p class="note">Open each generated PNG below, save it to Photos, and confirm it
is not blank or cropped. The vertical file must report a 9:16 size.</p>

<script src="postcards.js"></script>
<script src="export.js"></script>
<script>
const V = document.getElementById("v"), T = document.getElementById("t");
const rows = [];
function add(name, val, cls) {
  rows.push([name, val, cls || ""]);
  T.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td class="${r[2]}">${r[1]}</td></tr>`).join("");
}
const say = (t, c) => { V.textContent = t; V.className = "verdict " + c; };
function report(verdict, detail) {
  try {
    fetch("/report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        test: "png-exports", verdict, detail: detail || "",
        ua: navigator.userAgent,
      }),
      keepalive: true,
    }).catch(() => {});
  } catch (e) { /* the standalone page still shows its local verdict */ }
}

const canvas = document.createElement("canvas");
canvas.width = 640; canvas.height = 400;
const cx = canvas.getContext("2d");

function drawScene() {
  const g = cx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, "#697996"); g.addColorStop(1, "#3d342e");
  cx.fillStyle = g; cx.fillRect(0, 0, canvas.width, canvas.height);
  cx.fillStyle = "#49695f"; cx.fillRect(390, 190, 200, 115);
  cx.fillStyle = "#6b4a32"; cx.fillRect(165, 275, 210, 48);
  cx.fillStyle = "#c1272d"; cx.beginPath(); cx.arc(320, 205, 68, 0, 7); cx.fill();
  cx.fillStyle = "#fff"; cx.font = "700 24px system-ui";
  cx.fillText("Santa still export test", 24, 42);
}

document.getElementById("go").addEventListener("click", run);

function blobOf(c) {
  return new Promise(resolve => c.toBlob(resolve, "image/png"));
}

function addDownload(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.className = "save"; a.href = url; a.download = name;
  a.textContent = "Open / save " + name;
  document.getElementById("downloads").appendChild(a);
}

async function run() {
  rows.length = 0; T.innerHTML = "";
  document.getElementById("downloads").textContent = "";
  say("Testing PNG export…", "busy");
  try {
    const still = await ExportVideo.exportStill(canvas, drawScene, 0);
    add("Full-frame PNG", still && still.size > 5000
        ? Math.round(still.size / 1024) + " KB" : "empty",
        still && still.size > 5000 ? "ok" : "no");

    drawScene();
    const vertical = ExportVideo.verticalCanvas(canvas, { caption: "Santa came to our house" });
    const verticalBlob = await blobOf(vertical);
    const exact = vertical.width === Math.round(vertical.height * 9 / 16);
    add("Vertical dimensions", vertical.width + "×" + vertical.height,
        exact ? "ok" : "no");
    add("Vertical PNG", verticalBlob && verticalBlob.size > 5000
        ? Math.round(verticalBlob.size / 1024) + " KB" : "empty",
        verticalBlob && verticalBlob.size > 5000 ? "ok" : "no");

    const card = document.createElement("canvas");
    card.width = canvas.width; card.height = canvas.height;
    Postcards.render(card.getContext("2d"), "evidence", {
      w: card.width, h: card.height, room: canvas,
      santa: null, place: { x: 320, y: 300 },
    });
    const cardBlob = await blobOf(card);
    add("Postcard PNG", cardBlob && cardBlob.size > 5000
        ? Math.round(cardBlob.size / 1024) + " KB" : "empty",
        cardBlob && cardBlob.size > 5000 ? "ok" : "no");

    if (!still || !verticalBlob || !cardBlob || !exact ||
        still.size <= 5000 || verticalBlob.size <= 5000 || cardBlob.size <= 5000) {
      throw new Error("one or more PNG outputs failed");
    }
    addDownload("santa-full.png", still);
    addDownload("santa-vertical.png", verticalBlob);
    addDownload("santa-postcard.png", cardBlob);
    say("PASS — all three PNG outputs were built", "pass");
    report("pass", vertical.width + "x" + vertical.height);
  } catch (e) {
    add("Error", e.message, "no");
    say("FAIL — PNG export did not complete", "fail");
    report("fail", e.message);
  }
}
</script>
</body>
</html>
